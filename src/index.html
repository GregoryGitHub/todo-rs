<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Tarefas</h1>
        <span id="counter" class="counter">0</span>
      </header>
      <form id="new-todo" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Nova tarefa..."
          maxlength="200"
          autofocus
        />
        <button type="submit" aria-label="Adicionar">+</button>
      </form>
      <ul id="list"></ul>
      <p id="empty" class="empty" hidden>Sem tarefas. Bora produzir!</p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
