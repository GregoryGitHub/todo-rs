<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <!-- Subtle Window Controls Bar -->
      <div class="window-bar" data-tauri-drag-region>
        <div class="drag-spacer" data-tauri-drag-region></div>
        <div class="window-controls">
          <button id="btn-hide" class="bar-btn" title="Ocultar na bandeja">
            <i class="fa-solid fa-minus"></i>
          </button>
          <div class="menu-container">
            <button id="btn-menu-toggle" class="bar-btn" title="Opções">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
            <div id="menu-dropdown" class="menu-dropdown" hidden>
              <button id="menu-item-hide" class="menu-item">
                <i class="fa-solid fa-eye-slash"></i>
                Ocultar Janela
              </button>
              <div class="menu-divider"></div>
              <button id="menu-item-quit" class="menu-item danger">
                <i class="fa-solid fa-power-off"></i>
                Fechar Aplicativo
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Header -->
      <header class="app-header">
        <div class="header-title">
          <h1 id="view-title">
            <i class="fa-solid fa-sun"></i> Meu Dia
          </h1>
          <span id="counter" class="counter">0</span>
        </div>
        <button id="btn-reschedule-open" class="btn-secondary" title="Mover pendentes para o próximo dia">
          <i class="fa-solid fa-calendar-plus"></i>
          <span class="btn-label">Mover</span>
        </button>
      </header>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs">
        <button id="tab-my-day" class="tab-btn active">
          <i class="fa-solid fa-sun"></i> Meu Dia
        </button>
        <button id="tab-all" class="tab-btn">
          <i class="fa-solid fa-list-check"></i> Todas
        </button>
      </nav>

      <!-- New Todo Form -->
      <form id="new-todo" autocomplete="off">
        <div class="input-wrapper">
          <i class="fa-solid fa-plus input-icon"></i>
          <input
            id="input"
            type="text"
            placeholder="Adicionar uma tarefa..."
            maxlength="200"
            autofocus
          />
        </div>
        <button type="submit" class="btn-add" aria-label="Adicionar">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Todo List -->
      <ul id="list" class="todo-list"></ul>
      <p id="empty" class="empty" hidden>
        <i class="fa-solid fa-circle-check empty-icon"></i><br />
        <span id="empty-text">Sem tarefas. Bora produzir!</span>
      </p>

      <!-- Reschedule Modal -->
      <div id="modal-reschedule" class="modal-overlay" hidden>
        <div class="modal-content">
          <div class="modal-header">
            <h3>
              <i class="fa-solid fa-calendar-days"></i> Mover Tarefas
            </h3>
            <button id="modal-close" class="btn-icon" aria-label="Fechar">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body">
            <p class="modal-desc">
              Escolha a data para mover todas as tarefas pendentes:
            </p>
            <div class="date-picker-container">
              <label for="reschedule-date">Data de destino:</label>
              <input type="date" id="reschedule-date" class="date-input" />
            </div>
          </div>
          <div class="modal-footer">
            <button id="btn-cancel-reschedule" class="btn-flat">Cancelar</button>
            <button id="btn-confirm-reschedule" class="btn-primary">
              <i class="fa-solid fa-check"></i> Confirmar
            </button>
          </div>
        </div>
      </div>

      <!-- Pomodoro Modal -->
      <div id="modal-pomodoro" class="modal-overlay" hidden>
        <div class="modal-content pomodoro-modal-content">
          <div class="modal-header">
            <h3>
              <i class="fa-solid fa-stopwatch"></i> Timer Pomodoro
            </h3>
            <button id="pomodoro-modal-close" class="btn-icon" aria-label="Fechar">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body pomodoro-body">
            <p id="pomodoro-task-name" class="pomodoro-task-title">Nome da Tarefa</p>
            
            <div id="pomodoro-mode-badge" class="pomo-mode-badge work">
              <i id="pomo-badge-icon" class="fa-solid fa-brain"></i>
              <span id="pomo-badge-text">Foco</span>
            </div>

            <!-- Big Timer Counter -->
            <div class="pomodoro-timer-display">
              <span id="pomodoro-time-display">25:00</span>
            </div>

            <!-- Controls: Start/Pause, Reset -->
            <div class="pomodoro-controls">
              <button id="btn-pomo-toggle" class="btn-primary btn-pomo-main">
                <i id="pomo-toggle-icon" class="fa-solid fa-play"></i>
                <span id="pomo-toggle-text">Iniciar</span>
              </button>
              <button id="btn-pomo-reset" class="btn-secondary" title="Reiniciar Timer">
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>

            <!-- Quick Settings -->
            <div class="pomodoro-settings">
              <div class="pomo-input-group">
                <label for="pomo-work-input">Foco (min)</label>
                <input type="number" id="pomo-work-input" min="1" max="120" value="25" class="pomo-num-input" />
              </div>
              <div class="pomo-input-group">
                <label for="pomo-break-input">Pausa (min)</label>
                <input type="number" id="pomo-break-input" min="1" max="60" value="5" class="pomo-num-input" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
