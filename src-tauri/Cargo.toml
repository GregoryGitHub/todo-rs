[package]
name = "todo-rs"
version = "0.2.0"
edition = "2021"
description = "Lightweight todo list running in the Windows tray"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "multipart", "gzip", "brotli", "deflate", "cookies"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros"] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
